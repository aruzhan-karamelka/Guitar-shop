<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Result - Guitar Shop</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style1.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="icon" type="image/x-icon" href="images/logo.png">
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="navbar">
        <div class="logo">
          <img src="images/logo.png" width="110" height="40" alt="Guitar shop logo">
        </div>
        <h3 class="logo-name">Dream&Strings</h3>
        <nav aria-label="Main navigation">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about&contact.html">About&Contact</a></li>
            <li><a href="registration.html" id="accountLink">Sign Up / Log In</a></li>
          </ul>
        </nav>
        <button type="button" id="themeBtn" class="theme-toggle" aria-pressed="false">
        Dark Mode</button>
      </div>
    </div>
  </header>
  <main id="main-content">
    <section class="demo-result">
      <div class="container">
        <h1 id="welcomeTitle">User Profile</h1>
        <p id="loginRequired" class="text-muted mt-3">You are not logged in. Please log in first.</p>
        <div id="profileData" class="mt-4 p-4 border rounded" style="text-align: left; max-width: 500px; margin: 0 auto; display: none;">
          <p><strong>Name:</strong>
            <span id="pFirstName"></span>
            <span id="pLastName"></span></p>
            <p><strong>Email:</strong>
              <span id="pEmail"></span></p>
              <p><strong>Phone:</strong>
                <span id="pPhone"></span></p>
              </div>
              <button id="logoutBtn" class="btn btn-danger mt-3" style="display: none;">Log Out</button><br><br>
              <a href="about&contact.html" class="btn">Back to About & Contact</a></div>
            </section>
          </main>
          
          <footer class="footer">
            <div class="container">
              <p class="copyright">Copyright &copy; 2026 Guitar Shop</p>
            </div>
          </footer>
          <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
          <script src="script.js"></script>
        </body>
        </html>
